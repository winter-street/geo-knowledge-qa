app:
  description: Privacy-safe client workflow for the synthetic geological investigation Agent.
  icon: GA
  icon_background: '#E8F1EC'
  mode: workflow
  name: Synthetic Geological Investigation Agent
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables:
    - description: Base URL of the running public backend.
      id: backend_base_url
      name: backend_base_url
      selector: [env, backend_base_url]
      value: http://host.docker.internal:3000
      value_type: string
    - description: JWT obtained from the backend login endpoint. Keep this value private.
      id: backend_token
      name: backend_token
      selector: [env, backend_token]
      value: ''
      value_type: secret
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: http-request
        id: start-http
        source: start
        sourceHandle: source
        target: ask-backend
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: http-request
          targetType: end
        id: http-end
        source: ask-backend
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
    nodes:
      - data:
          desc: Collect a geological question and retrieval options.
          selected: false
          title: Start
          type: start
          variables:
            - label: Question
              max_length: 2000
              options: []
              required: true
              type: paragraph
              variable: question
            - label: Retrieval mode
              max_length: 20
              options: [rag, kg, hybrid]
              required: true
              type: select
              variable: retrieval_mode
            - label: Agent mode
              max_length: 20
              options: [direct, agent]
              required: true
              type: select
              variable: agent_mode
        height: 170
        id: start
        position: {x: 80, y: 160}
        positionAbsolute: {x: 80, y: 160}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization:
            config: null
            type: no-auth
          body:
            data:
              - id: body
                key: ''
                type: text
                value: '{"question":"{{#start.question#}}","retrievalMode":"{{#start.retrieval_mode#}}","agentMode":"{{#start.agent_mode#}}","stream":false}'
            type: raw-text
          desc: Call the same typed backend capability used by the Vue application.
          headers: |-
            Authorization:Bearer {{#env.backend_token#}}
            Content-Type:application/json
          method: post
          params: ''
          selected: false
          ssl_verify: true
          timeout:
            connect: 10
            max_connect_timeout: 0
            max_read_timeout: 0
            max_write_timeout: 0
            read: 60
            write: 10
          title: Ask geological Agent
          type: http-request
          url: '{{#env.backend_base_url#}}/api/qa/ask'
          variables: []
        height: 160
        id: ask-backend
        position: {x: 390, y: 160}
        positionAbsolute: {x: 390, y: 160}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: Return the backend JSON response including citations and tool trace.
          outputs:
            - value_selector: [ask-backend, body]
              variable: response
          selected: false
          title: End
          type: end
        height: 110
        id: end
        position: {x: 700, y: 160}
        positionAbsolute: {x: 700, y: 160}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport: {x: 0, y: 0, zoom: 1}
